name: Ingest Carleton Food Events

on:
  schedule:
    - cron: "17,47 * * * *"

  workflow_dispatch:

concurrency:
  group: carleton-event-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ingest Carleton events
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Ingestion attempt ${attempt}/3"
            if npm run collector:ingest; then
              exit 0
            else
              status=$?
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Ingestion failed after 3 attempts (exit code ${status})"
              exit "$status"
            fi

            if [ "$attempt" -eq 1 ]; then
              delay=60
            else
              delay=180
            fi
            echo "Retrying in ${delay} seconds"
            sleep "$delay"
          done
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CF3_ALERT_EMAIL: ${{ secrets.CF3_ALERT_EMAIL }}
          CF3_FROM_EMAIL: ${{ secrets.CF3_FROM_EMAIL }}
