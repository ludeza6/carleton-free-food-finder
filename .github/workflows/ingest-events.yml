name: Ingest Carleton Food Events

on:
  schedule:
    - cron: "17,47 * * * *"

  workflow_dispatch:

concurrency:
  group: carleton-event-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ingest Carleton events
        run: npm run collector:ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CF3_ALERT_EMAIL: ${{ secrets.CF3_ALERT_EMAIL }}
          CF3_FROM_EMAIL: ${{ secrets.CF3_FROM_EMAIL }}
